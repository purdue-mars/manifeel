name: rdp_usb_tactile

image_shape: [3, 240, 320]

shape_meta: &shape_meta
  obs:
    front:
      shape: [3, 240, 320]
      type: rgb
    wrist:
      shape: [3, 240, 320]
      type: rgb
    left_tactile_camera_taxim:
      shape: [3, 240, 320]
      type: rgb
    right_tactile_camera_taxim:
      shape: [3, 240, 320]
      type: rgb
    state:
      shape: [7]
      type: low_dim
  action:
    shape: [6]

env_runner:
  _target_: manifeel.env_runner.vistac_pih_runner_unit.ManifeelRunner
  shape_meta: ${shape_meta}
  isaacgym_cfg_name: ${isaacgym_cfg_name}
  n_test: 22
  n_test_vis: 2
  test_start_seed: 100000
  max_steps: 500
  n_obs_steps: ${n_obs_steps}
  n_action_steps: ${n_action_steps}
  fps: 10
  past_action: ${past_action_visible}
  tactile_size: [240, 320]

dataset:
  _target_: manifeel.dataset.rdp_real_image_tactile_dataset.RealImageTactileDataset
  shape_meta: *shape_meta
  dataset_path: data/usb_quan_Aug05
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1'}
  pad_after: ${eval:'${n_action_steps}-1'}
  n_obs_steps: ${n_obs_steps}
  seed: 42
  val_ratio: 0.05
  max_train_episodes: null
